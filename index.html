function goalsList(){screen.innerHTML=`<div class="banner"><strong>목표 수치 일람 · ${db.agents.length}명</strong><p class="muted">전용 엔진 중심 실용 / 종결급 비교. 캐릭터를 선택하면 대체 엔진과 출처를 볼 수 있습니다. 평균적 목표는 유저 전체의 실측 평균이 아닙니다.</p></div><div class="goals-controls"><input id="goalSearch" placeholder="캐릭터 검색" aria-label="목표 수치 캐릭터 검색"><select id="goalRole" aria-label="특성"><option value="">전체 특성</option>${[...new Set(db.agents.map(a=>a.role))].sort(agentCollator.compare).map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="goalEngine" aria-label="엔진 구분"><option value="signature">전용 / 권장 빌드</option><option value="alt">대체 엔진</option></select><select id="goalQuality" aria-label="검증 수준"><option value="">전체 검증 수준</option><option value="multi">복수 자료 대조</option><option value="single">단일 자료 / 참고</option></select></div><section class="panel goal-list"><div id="goalListCount" class="muted"></div><div class="goal-table-wrap" id="goalListBody"></div></section><p class="goal-note">자료가 한 곳뿐인 캐릭터의 실용 목표는 편집 참고치입니다. 대체 엔진별 수치를 찾지 못한 경우 미확인으로 표시합니다. 파티 버프, 시즌, 보스 상성 및 돌파에 따라 달라집니다.</p>`;const draw=()=>{let q=$('#goalSearch').value.trim(),role=$('#goalRole').value,mode=$('#goalEngine').value,quality=$('#goalQuality').value;let list=db.agents.filter(a=>(!q||agentMatches(a,q))&&(!role||a.role===role)&&(!quality||(quality==='multi')===String(a.goalStats?.quality||'').startsWith('복수'))).sort(agentOrder);$('#goalListCount').textContent=`${list.length}명 · ${mode==='alt'?'대체 엔진':'전용 / 권장 빌드'}`;$('#goalListBody').innerHTML=`<table class="goal-table"><thead><tr><th>캐릭터</th><th>실용 목표</th><th>종결급 / 상한</th><th>자료 상태</th></tr></thead><tbody>${list.map(a=>{let g=a.goalStats,r=mode==='alt'?g?.alt:g?.rows;return `<tr><td><button class="agent-link" data-open="${esc(a.id)}" data-default-tab="goals">${portrait(a,'small')}<span>${esc(a.name)}</span></button><span class="goal-condition">${esc(a.role)} · ${esc(elementGroup(a.element))}</span></td>${r?.length?`<td class="cell-lines">${r.map(x=>`<div>${esc(x.label)} ${esc(x.mid)}</div>`).join('')}</td><td class="cell-lines">${r.map(x=>`<div>${esc(x.label)} <strong>${esc(x.high)}</strong></div>`).join('')}</td>`:'<td colspan="2" class="muted">정량 목표 미확인</td>'}<td class="goal-source">${esc(g?.quality||'미등록')}${mode==='alt'?`<span class="goal-condition">${esc(g?.altNote||'')}</span>`:''}</td></tr>`}).join('')}</tbody></table>`};for(const id of Object.keys(goalFilter)){const el=$('#'+id);el.value=goalFilter[id];if(el.tagName==='SELECT'&&el.selectedIndex<0)el.selectedIndex=0;el.addEventListener(id==='goalSearch'?'input':'change',()=>{goalFilter[id]=el.value;draw()})}draw()}

</div><div class="panel"><h3>위험한 강습전</h3><p>${esc(a.assault)}</p></div><small>콘텐츠 평가와 운영 조언은 편집자의 정성 판단입니다.</small>`;if(detailTab==='video')b.innerHTML=videoSection(a);$('#back').onclick=backRoute;screen.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>switchDetailTab(x.dataset.tab))}
const num=x=>Number(x).toLocaleString('ko-KR',{maximumFractionDigits:2});
function targetText(r){return (r.minimum===r.goal?num(r.goal):num(r.minimum)+'–'+num(r.goal))+(r.unit||'')+(r.cap!==null?' (상한 '+num(r.cap)+r.unit+')':'')}
function signature(a,e){return !!e&&e.name===a.engines[0]?.name}

function mind(){let a=db.agents.filter(a=>features(a).length).sort(agentOrder);screen.innerHTML=`<div class="banner"><strong>플레이 변화 중심 돌파</strong><p class="muted">M1–M2 중 조작, 시작 자원, 사이클 개선 효과가 있는 돌파를 모았습니다. 절대 DPS 순위가 아닙니다.</p></div>${a.map(a=>`<div class="panel"><div class="headrow"><div class="agent-identity">${portrait(a,'small')}<span><strong>${esc(a.name)}</strong> ${tag(a.role)}</span></div><button data-open="${esc(a.id)}" data-default-tab="mind">상세</button></div>${features(a).map(x=>`<div class="lineitem"><strong>M${x.level} ${tag(x.kind,true)}</strong><p>${esc(x.note)}</p></div>`).join('')}</div>`).join('')||'<p class="empty">등록된 돌파 없음</p>'}`}
/* Party analysis: character-only, nominal skill values, no damage simulation. */
const partyKey='zzz-party-analysis-v1';
let partyState=load(partyKey,{ids:['miyabi','nangong-yu','ukinami-yuzuha'],m:[0,0,0],p:[false,false,false],vanguard:''});
function sanitizeParty(){
 if(!partyState||!Array.isArray(partyState.ids))partyState={ids:[],m:[],p:[]};
 let seen=new Set();partyState.ids=Array.from({length:3},(_,i)=>{let id=partyState.ids[i];if(!id||!byid(id)||seen.has(id))return '';seen.add(id);return id});
 partyState.m=Array.from({length:3},(_,i)=>Math.min(6,Math.max(0,Math.trunc(Number(partyState.m?.[i])||0))));
 partyState.p=Array.from({length:3},(_,i)=>partyState.p?.[i]===true);
 if(typeof partyState.vanguard!=='string')partyState.vanguard='';
}
const partyConditions={element:'같은 기본 속성',faction:'같은 진영',defensive:'방어 지원 가능'};
function gateKeys(a,potential){let g=Array.isArray(a.partyMeta?.gate)?a.partyMeta.gate:[];if(a.id==='koleda'&&potential)g=[...new Set([...g,'명파','단조'])];return g}
function gateText(a,potential=false){const g=gateKeys(a,potential);return g.length?g.map(x=>partyConditions[x]||x).join(' 또는 ')+' 동료 1명 이상':'추가 능력 조건 미등록'}
function gateEval(a,team,potential=false){let keys=gateKeys(a,potential);if(!keys.length)return {status:'unknown',text:'조건 미검증'};let other=team.filter(b=>b&&b.id!==a.id);let possible=false;for(let b of other){for(let k of keys){if(k==='element'){if(elementGroup(a.element)===elementGroup(b.element))return {status:'yes',text:b.name+' · 같은 기본 속성'};}
 else if(k==='faction'){if(a.partyMeta?.faction&&b.partyMeta?.faction){if(a.partyMeta.faction===b.partyMeta.faction)return {status:'yes',text:b.name+' · 같은 진영'};}else possible=true;}
 else if(k==='defensive'){if(['lighter','burnice','jane-doe','evelyn','miyabi','claret','anby-soldier-0','qingyi','koleda','lycaon','hugo','dialyn','nangong-yu','roxy','lucia','yixuan','yidhari','banyue','sunna','zhao','phoenix','aria'].includes(b.id))return {status:'yes',text:b.name+' · 방어 지원'};else if(!['rina','grace','zhu-yuan','trigger','astra-yao'].includes(b.id))possible=true;}
 else if(b.role===k)return {status:'yes',text:b.name+' · '+k};}}
 if(possible||other.length<2)return {status:'unknown',text:possible?'진영/방어 지원 조건 일부 미확인':'빈 슬롯이 있어 최종 판정 보류'};
 return {status:'no',text:'필요 특성·속성·진영 동료 없음'};
}
const partyStatusText={yes:'적용 대상',no:'미적용',partial:'조건부 / 일부 피해',limited:'주력 피해 미적용',unknown:'확인 필요'};
function roleMatch(a,b,r){return !(r.roles&&!r.roles.includes(b.role)||r.excludeRoles&&r.excludeRoles.includes(b.role));}
const knownAftershock=new Set(['anby-soldier-0','orphie-magus','trigger','ju-fufu','lucia']);
const knownAbloom=new Set(['vivian','promeia','aria','phoenix','velina','nangong-yu','burnice']);
function relevant(r,b){let effect=r.effect, e=elementGroup(b.element);
 if(r.elements&&!r.elements.includes(e))return {status:'limited',text:'주 속성 '+e+'의 피해에는 미적용 (부속성/반응 예외 가능)'};
 if(r.excludeElements&&r.excludeElements.includes(e))return {status:'limited',text:'주 속성 '+e+'의 피해에는 미적용'};
 if(r.dynamicElement)return {status:'partial',text:'실제로 발생한 오염·정화 속성에 따라 적용'};
 if(effect==='sheerdmg'&&b.role!=='명파')return {status:'limited',text:'명파 피해에만 적용'};
 if(effect==='sheer'&&b.role!=='명파'&&b.id!=='norma')return {status:'limited',text:'스탯 버프는 부여되지만 주력 피해에 관입력 환산 없음'};
 if(effect==='atk'&&b.role==='단조')return {status:'limited',text:'공격력은 부여되지만 단조의 방어력 기반 주력 피해에는 미적용'};
 if(effect==='critdmg'&&b.role==='단조')return {status:'limited',text:'단조 주력 피해는 전투 치피 대신 절상 피해 사용'};
 if(effect==='critdmg'&&b.role==='이상')return {status:'partial',text:'치명타 가능한 공격만 적용 · 일반 속성 이상 피해와 구분'};
 if(effect==='def'&&b.role!=='단조')return {status:'partial',text:'방어력은 적용 · 주로 생존 효과 (방어력 기반 피해 예외)'};
 if(effect==='hp'&&b.role!=='명파')return {status:'partial',text:'최대 HP 적용 · HP 기반 피해가 아니면 주로 생존 효과'};
 if(['pen','defignore','defdown'].includes(effect)&&b.role==='명파')return {status:'limited',text:'명파 주력 피해는 방어력 무시 · 일반 피해에는 효과 가능'};
 if(effect==='energy'&&b.role==='단조')return {status:'limited',text:'단조는 예리도 사용 · 에너지 회복이 주 자원에 미적용'};
 if(['anomaly','anomaly_disorder','disorder','buildup'].includes(effect)&&b.role!=='이상')return {status:'partial',text:'일반 직격 피해에는 미적용 · 해당 이상/혼돈/축적을 발생시킬 때만'};
 if(effect==='aftershock'&&!knownAftershock.has(b.id))return {status:'partial',text:'여진에만 적용 · 해당 캐릭터의 여진 보유/발동 별도 확인'};
 if(effect==='abloom'&&!knownAbloom.has(b.id))return {status:'partial',text:'추가 이상 피해(Abloom)에만 적용 · 해당 스킬 확인 필요'};
 if(effect==='wind'&&e!=='바람')return {status:'partial',text:'바람 이상 지속 시간만 변경 · 다른 주 속성의 일반 피해에는 미적용'};
 return {status:'yes',text:'대상 조건 충족 · 실제 전투 발동 필요'};
}
function buffEval(a,b,r,team,potential,mind){
 if((r.mind||0)>mind)return {status:'no',text:`${r.mind}돌 필요`};
 if(r.potential&&!potential)return {status:'no',text:'잠재력 해방 필요'};
 if(r.scope==='others'&&a.id===b.id)return {status:'no',text:'자기 자신 제외'};
 if(r.scope==='self'&&a.id!==b.id)return {status:'no',text:'자기 자신만'};
 if(!roleMatch(a,b,r))return {status:'no',text:'대상 특성 불일치 · '+b.role};
 if(r.gate){const g=gateEval(a,team,potential);if(g.status!=='yes')return g.status==='no'?{status:'no',text:'추가 능력 미활성'}:g;}
 if(r.scope==='vanguard'){
  if(b.role!=='강공'||a.id===b.id)return {status:'no',text:'시드 외 강공 전위만 수혜'};
  let candidates=team.filter(x=>x&&x.role==='강공'&&x.id!==a.id);
  if(candidates.length>1){if(candidates.some(x=>x.id===partyState.vanguard)){if(b.id!==partyState.vanguard)return {status:'no',text:'선택한 전위가 아님'};}else return {status:'unknown',text:'강공 전위 선택 필요 (초기 공격력 가장 높은 동료)'};}
 }
 if(r.scope==='active')return {status:'partial',text:'온필드 상태일 때만 적용'};
 if(r.scope==='next')return {status:'partial',text:'실제 빠른 지원 대상과 콤보 전환 여부에 따라 적용'};
 return relevant(r,b);
}
function valueFor(r,team){if(r.dynamic==='remielle'){let n=team.filter(a=>a?.role==='이상').length;return `초기 공격력의 ${[0,6,12,40][n]}% (최대 +1,600)`;}return r.value;}
function scopeText(r){let target={team:'파티 전체',others:'다른 파티원',self:'자신',active:'온필드',vanguard:'시드 외 강공 전위',next:'빠른 지원 대상'}[r.scope]||'파티';if(r.roles)target+=' · '+r.roles.join('/')+' 한정';if(r.excludeRoles)target+=' · '+r.excludeRoles.join('/')+' 제외';if(r.elements)target+=' · '+r.elements.join('/')+' 피해';return target;}
function sourceLink(a){return a.buffSource&&safeLink(a.buffSource)?`<a class="source" href="${safeLink(a.buffSource)}" target="_blank" rel="noopener noreferrer">능력치·스킬 근거 ↗</a>`:''}
function buffDetail(a){const buffs=Array.isArray(a.partyBuffs)?a.partyBuffs:[];return `<div class="panel"><h3>추가 능력 발동 조건</h3><p>${esc(gateText(a))}</p>${a.id==='koleda'?'<small>잠재력 해방 후 명파·단조 조건도 포함됩니다.</small>':''}<p class="tiny">파티 편성 조건과 개별 버프의 수혜 대상을 구분합니다.</p></div><div class="panel"><h3>캐릭터 자체 파티 버프</h3><small>레벨 60 · 핵심 스킬 최대 기준의 명목값. 전무/디스크/방부 제외. 일부 돌파·잠재력 해방 효과 포함.</small>${buffs.length?buffs.map(r=>`<div class="lineitem"><div class="headrow"><strong>${esc(r.label)}</strong><strong class="buff-yes">${esc(r.value)}</strong></div><p class="muted">${esc(scopeText(r))} ${r.mind?tag(r.mind+'돌'):''}${r.potential?tag('잠재력 해방'):''}${r.gate?tag('추가 능력 필요'):''}</p><p class="tiny">${esc(r.condition)}</p>${r.nonstack?`<p class="tiny">${esc(r.nonstack)}</p>`:''}</div>`).join(''):'<p class="buff-unknown">파티 공유 효과 수치 미검증. 버프가 없다는 뜻이 아닙니다.</p>'}<p class="tiny">${esc(a.buffStatus||'데이터 미등록')}</p>${sourceLink(a)}</div><button class="primary" data-party-add="${esc(a.id)}">이 캐릭터로 파티 분석</button>`}
function partyCards(a,team,index){let rows=Array.isArray(a.partyBuffs)?a.partyBuffs:[],g=gateEval(a,team,partyState.p[index]);let active=rows.filter(r=>!(r.mind&&r.mind>partyState.m[index])&&!(r.potential&&!partyState.p[index]));return `<div class="panel party-provider"><div class="headrow">${identity(a,'small')}<span class="tag buff-${g.status}">추가 능력 ${g.status==='yes'?'충족':g.status==='no'?'미충족':'확인 필요'}</span></div><p class="tiny">${esc(gateText(a,partyState.p[index]))} · ${esc(g.text)}</p>${!active.length?'<p class="buff-unknown">현재 선택 조건에서 확인된 파티 공유 수치 없음 (미검증 포함).</p>':active.map(r=>`<div class="buff-line"><div class="headrow"><strong>${esc(r.label)}</strong><small>${r.mind?'M'+r.mind+' · ':''}${r.potential?'잠재력 해방 · ':''}${esc(scopeText(r))}</small></div><div class="buff-matrix">${team.filter(Boolean).map(b=>{let result=buffEval(a,b,r,team,partyState.p[index],partyState.m[index]);return `<div class="buff-cell buff-${result.status}"><span class="buff-recipient">${esc(b.name)}</span><strong>${esc(valueFor(r,team))}</strong><small>${esc(partyStatusText[result.status]||'확인 필요')}</small><p>${esc(result.text)}</p></div>`}).join('')}</div><p class="tiny">${esc(r.condition)}${r.nonstack?' · '+esc(r.nonstack):''}</p></div>`).join('')}<p class="tiny">${esc(a.buffStatus||'일부 효과 미등록')}</p>${sourceLink(a)}</div>`}
function compare(){sanitizeParty();let team=partyState.ids.map(id=>id?byid(id):null), full=team.every(Boolean);let candidates=team.filter(x=>x&&x.role==='강공'&&x.id!=='seed');let hasSeed=team.some(x=>x?.id==='seed');let extensions=team.filter(Boolean).flatMap(a=>(a.partyBuffs||[]).filter(r=>r.nonstack?.includes('그로기 연장')&&(!r.mind||partyState.m[team.indexOf(a)]>=r.mind)).map(r=>a.id));
 screen.innerHTML=`<div class="banner"><strong>3인 파티 분석</strong><p class="muted">임의의 3명을 선택하면 캐릭터 자체 버프의 발동 조건 및 수혜 대상을 비교합니다.</p><div class="buff-legend"><span class="buff-yes">● 적용 가능</span><span class="buff-no">● 미적용</span><span class="buff-limited">● 주력 피해 미적용</span><span class="buff-partial">● 조건부</span><span class="buff-unknown">● 미확인</span></div><p class="tiny">명목 최대 수치 기준이며 실제 피해량 증가율은 아닙니다. 장비·디스크·방부 제외, 일부 돌파/잠재력 효과만 등록.</p></div><div class="party-picks">${team.map((a,i)=>`<div class="panel party-pick"><label>슬롯 ${i+1}</label><select data-party-id="${i}" aria-label="파티 슬롯 ${i+1}"><option value="">선택 안 함</option>${db.agents.map(x=>`<option value="${esc(x.id)}" ${a?.id===x.id?'selected':''} ${partyState.ids.includes(x.id)&&a?.id!==x.id?'disabled':''}>${esc(x.name)} · ${esc(x.role)}</option>`).join('')}</select>${a?`${identity(a,'small')}${tag(elementGroup(a.element))}${tag(a.role)}<label>돌파</label><select data-party-m="${i}" aria-label="슬롯 ${i+1} 돌파">${[0,1,2,3,4,5,6].map(n=>`<option value="${n}" ${partyState.m[i]===n?'selected':''}>${n===0?'명함':n+'돌'}</option>`).join('')}</select><label class="party-check"><input type="checkbox" data-party-p="${i}" ${partyState.p[i]?'checked':''}> 잠재력 해방 (등록 효과)</label><button data-open="${esc(a.id)}" class="link">상세 공략</button>`:'<small>캐릭터를 선택하세요.</small>'}</div>`).join('')}</div><div class="panel"><div class="headrow"><h3>예시 조합 / 초기화</h3><button data-party-clear>초기화</button></div><div class="party-presets"><button data-party-preset="miyabi,nangong-yu,ukinami-yuzuha">미야비 파티</button><button data-party-preset="ye-shunguang,dialyn,sunna">빛나 파티</button><button data-party-preset="claret,roxy,rina">클라렛 파티</button><button data-party-preset="yixuan,dialyn,lucia">명파 파티</button></div>${hasSeed&&candidates.length>1?`<label>시드 전위 (초기 공격력이 가장 높은 다른 강공)</label><select id="partyVanguard"><option value="">미지정</option>${candidates.map(a=>`<option value="${esc(a.id)}" ${partyState.vanguard===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:''}<p class="tiny">${full?'3인 구성 완료':'빈 슬롯이 있으면 추가 능력의 최종 판정이 보류될 수 있음'}</p>${new Set(extensions).size>1?'<p class="buff-partial">주의: 여러 그로기 연장 효과가 선택됨. 중첩 불가 효과는 합산하지 않습니다.</p>':''}</div>${team.map((a,i)=>a?partyCards(a,team,i):'').join('')}<div class="panel"><small>빨간색은 대상 불일치/추가 능력 미충족 또는 주력 피해 미적용이며, 버프 수치가 실제 적용되는 경우라도 해당 피해 유형에 한정될 수 있습니다. 같은 종류의 장막·그로기 연장·계수 변경 등은 합산하지 않습니다. <a href="https://senseos.gg/guides/zenless-zone-zero/zenless-zone-zero-agents-by-specialty/" target="_blank" rel="noopener noreferrer">추가 능력 조건 참고</a> · 파티원의 실시간 스탯과 적 상태는 입력하지 않으므로 실제 발동률이나 DPS는 계산하지 않습니다.</small></div>`;
 const refresh=()=>{save(partyKey,partyState);compare()};
 screen.querySelectorAll('[data-party-id]').forEach(el=>el.onchange=()=>{let i=+el.dataset.partyId;partyState.ids[i]=el.value;partyState.m[i]=0;partyState.p[i]=false;partyState.vanguard='';refresh()});
 screen.querySelectorAll('[data-party-m]').forEach(el=>el.onchange=()=>{partyState.m[+el.dataset.partyM]=Number(el.value);refresh()});
 screen.querySelectorAll('[data-party-p]').forEach(el=>el.onchange=()=>{partyState.p[+el.dataset.partyP]=el.checked;refresh()});
 screen.querySelectorAll('[data-party-preset]').forEach(el=>el.onclick=()=>{partyState={ids:el.dataset.partyPreset.split(','),m:[0,0,0],p:[false,false,false],vanguard:''};if(partyState.ids.includes('rina'))partyState.p[partyState.ids.indexOf('rina')]=true;refresh()});
 screen.querySelector('[data-party-clear]').onclick=()=>{partyState={ids:['','',''],m:[0,0,0],p:[false,false,false],vanguard:''};refresh()};let v=$('#partyVanguard');if(v)v.onchange=()=>{partyState.vanguard=v.value;refresh()};
}

function update(id=null){editId=id;let a=byid(id);screen.innerHTML=`<div class="banner"><strong>공략 데이터 업데이트</strong><p class="muted">웹사이트가 새 버전으로 배포되면 새로고침 시 최신 기본 공략을 불러옵니다. 기본 캐릭터의 수동 편집은 새 배포에서 덮어쓸 수 있으므로 JSON으로 백업하세요. 필요하면 JSON 파일을 가져오거나 한 명씩 수정합니다. W-엔진과 등록된 캐릭터 이름은 한국어로 자동 정리되며, 캐릭터 목록은 가나다순으로 정렬됩니다. 파생 속성은 기본 속성으로 묶어 표시합니다. 자동 수집이나 계정 인증은 하지 않습니다.</p></div><div class="panel"><h3>1. 공식 및 공략 출처 확인</h3><p><a href="https://zenless.hoyoverse.com/ko-kr/" target="_blank" rel="noopener">공식 홈페이지</a> · <a href="https://www.prydwen.gg/zenless/characters/" target="_blank" rel="noopener">Prydwen</a> · <a href="https://www.icy-veins.com/zenless-zone-zero/" target="_blank" rel="noopener">Icy Veins</a> · <a href="https://www.laqoos.com/ko-KR/zzz/weapons" target="_blank" rel="noopener">W-엔진 한국어 명칭</a> · <a href="https://zenless.hoyoverse.com/ko-kr/main?page=character" target="_blank" rel="noopener">공식 캐릭터 명칭</a></p></div><div class="panel"><h3>2. 데이터 백업 / 가져오기</h3><p class="muted">내보내기 파일을 수정하거나 새 데이터 팩을 가져옵니다. 같은 캐릭터 ID는 갱신, 새로운 ID는 추가됩니다.</p><div class="inline sectiongap"><button id="export" class="primary">JSON 내보내기</button><button id="sample">신규 등록 예시</button><button id="reset">초기 데이터 복원</button></div><label class="sectiongap" for="import">JSON 데이터 팩 선택</label><input id="import" type="file" accept=".json,application/json" style="max-width:100%"><button id="apply" class="sectiongap">가져오기 / 병합</button><div id="importStatus" class="status" role="status"></div></div><div class="panel"><h3>3. 캐릭터 직접 추가 / 수정</h3><p class="muted">형식에 맞게 JSON을 수정하세요. 모르는 효율 수치는 null로 입력할 수 있습니다.</p><label class="sectiongap" for="editSelect">캐릭터 선택</label><select id="editSelect" style="width:100%"><option value="">+ 신규 캐릭터</option>${db.agents.map(x=>`<option value="${esc(x.id)}" ${a?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><label class="sectiongap" for="editor">캐릭터 데이터</label><textarea id="editor" spellcheck="false"></textarea><div class="inline sectiongap"><button id="saveAgent" class="primary">추가 / 수정 저장</button><button id="removeAgent">선택 캐릭터 삭제</button></div><div id="editStatus" class="status" role="status"></div></div>`;const editor=$('#editor');editor.value=JSON.stringify(a||blank(),null,2);$('#editSelect').onchange=()=>{editId=$('#editSelect').value||null;editor.value=JSON.stringify(byid(editId)||blank(),null,2);replaceRoute()};$('#export').onclick=()=>download(db,'zzz-data.json');$('#sample').onclick=()=>download({schema:1,version:db.version,date:db.date,agents:[blank()]},'zzz-agent-template.json');$('#reset').onclick=()=>{if(confirm('수정 내용을 지우고 초기 48명 데이터로 복원할까요?')){commit(structuredClone(base));update()}};$('#apply').onclick=async()=>{let msg=$('#importStatus');try{let f=$('#import').files[0];if(!f)throw Error('JSON 파일을 선택하세요.');if(f.size>10*1024*1024)throw Error('10MB 이하 데이터 파일을 사용하세요.');let d=validate(JSON.parse(await f.text()));let map=new Map(db.agents.map(x=>[x.id,x]));d.agents.forEach(x=>{let old=map.get(x.id);if(!x.targets&&old?.targets)x.targets=old.targets;if(!Array.isArray(x.videoEvidence)&&Array.isArray(old?.videoEvidence))x.videoEvidence=old.videoEvidence;map.set(x.id,x)});if(!confirm((d.agents.length+'명 정보를 추가하거나 갱신할까요?')))return;let ok=commit({...d,agents:[...map.values()]});msg.textContent=`${d.agents.length}명 병합 완료. ${ok?'저장됨':'메모리에만 적용됨; JSON 백업 필요'}`;$('#editSelect').innerHTML='<option value="">+ 신규 캐릭터</option>'+db.agents.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}catch(e){msg.textContent='오류: '+e.message}};$('#saveAgent').onclick=()=>{let msg=$('#editStatus');try{let a=JSON.parse(editor.value);let map=new Map(db.agents.map(x=>[x.id,x]));if(!a.targets&&map.get(a.id)?.targets)a.targets=map.get(a.id).targets;map.set(a.id,a);let ok=commit({...db,date:new Date().toISOString().slice(0,10),agents:[...map.values()]});update(a.id);$('#editStatus').textContent=ok?'저장 완료':'메모리에만 저장됨; JSON 백업 필요'}catch(e){msg.textContent='오류: '+e.message}};$('#removeAgent').onclick=()=>{let id=$('#editSelect').value;if(id&&confirm(byid(id)?.name+' 공략을 삭제할까요?')){commit({...db,agents:db.agents.filter(x=>x.id!==id)});update()}}}
